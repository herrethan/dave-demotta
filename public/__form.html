<!--
  Static copy of the contact form so Netlify's deploy-time form detection can
  register it (Next.js pages aren't static, so the crawler can't see the React
  form). Field names must match components/ContactForm.tsx, which POSTs to
  this path. Never rendered to visitors.
  https://opennext.js.org/netlify/forms
-->
<form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <textarea name="message"></textarea>
  <input name="bot-field" />
</form>
